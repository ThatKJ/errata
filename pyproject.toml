[project]
name = "errata"
version = "0.1.0"
description = "Finds customer answers you already sent that a changed product fact made wrong, with Hindsight memory provenance."
requires-python = ">=3.11"
dependencies = [
    "certifi>=2024.2",
    "hindsight-client==1.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

pythonpath = ["."]
